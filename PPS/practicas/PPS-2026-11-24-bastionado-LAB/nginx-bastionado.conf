# Cabeceras de seguridad en nginx (defensa en profundidad: también las pone la
# aplicación, pero tenerlas en el borde protege aunque la app se despiste).
# Añade estas líneas dentro del bloque server { ... } de tu nginx-miweb.conf,
# junto a las que ya tienes, y recarga nginx con: sudo nginx -t && sudo systemctl reload nginx
#
#   add_header X-Frame-Options "DENY" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "no-referrer" always;
#   add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
#
# El 'always' hace que la cabecera se mande también en las respuestas de error
# (403, 404, 500), no solo en las 200.
