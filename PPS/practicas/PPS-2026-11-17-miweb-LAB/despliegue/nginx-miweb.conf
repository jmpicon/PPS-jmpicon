# nginx delante de miweb. Se copia a /etc/nginx/sites-available/miweb.
# Escucha en el 8080 y solo atiende a tu propio equipo (127.0.0.1) y a tu Kali
# por la red solo-anfitrión (192.168.56.0/24). Al resto de la red del aula le
# responde 403: tu web tiene fallos a propósito y no puede quedar expuesta.
server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/miweb_access.log;
    error_log  /var/log/nginx/miweb_error.log;

    allow 127.0.0.1;
    allow 192.168.56.0/24;
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Sustituye (no añade) la cabecera: así nadie puede falsear su IP
        # mandando su propio X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
