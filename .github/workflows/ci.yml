name: CI

on:
  push:
    branches: [main, develop]
    paths: ['CursoPPS/**']
  pull_request:
    branches: [main]
    paths: ['CursoPPS/**']

defaults:
  run:
    working-directory: CursoPPS

jobs:
  backend-lint:
    name: Backend · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: CursoPPS/backend/requirements.txt
      - run: pip install --upgrade pip ruff
        working-directory: CursoPPS/backend
      - run: ruff check app/ || true
        working-directory: CursoPPS/backend

  frontend-build:
    name: Frontend · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: CursoPPS/frontend/package-lock.json
      - run: npm install --prefer-offline
        working-directory: CursoPPS/frontend
      - run: npm run build
        working-directory: CursoPPS/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: CursoPPS/frontend/dist/
          retention-days: 7

  docker-build:
    name: Docker · Build images
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./CursoPPS/backend
          push: false
          tags: cursopps-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./CursoPPS/frontend
          push: false
          tags: cursopps-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security · Trivy
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend for scan
        uses: docker/build-push-action@v6
        with:
          context: ./CursoPPS/backend
          load: true
          tags: cursopps-backend:scan
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cursopps-backend:scan
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
